server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Healthcheck für Docker, wird von Caddy nicht veröffentlicht
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Setup-Seite für den ersten Admin. Der Token steht im Pfad, die Seite liest ihn selbst aus.
    # Nicht zwischenspeichern, nicht indizieren.
    location ~ "^/setup/[A-Za-z0-9_-]{1,128}$" {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
        try_files /pages/setup.html =404;
    }


    # Seiten mit festem Pfad. Nicht zwischenspeichern, nicht indizieren.
    location ~ "^/(login|forgot)$" {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
        try_files /pages/$1.html =404;
    }

    # Seiten mit Token im Pfad (Mail-Links). Die Seite liest den Token selbst aus.
    location ~ "^/(reset|confirm)/[A-Za-z0-9_-]{1,128}$" {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
        try_files /pages/$1.html =404;
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
