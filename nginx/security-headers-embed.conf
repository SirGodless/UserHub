# Für die Seite, die einen Dienst einbettet (/app/<dienst>). Wie security-headers.conf, aber mit frame-src: Der Hub darf
# https-Seiten in einem Rahmen laden. Ob ein Dienst sich einbetten lässt, entscheidet er selbst (frame-ancestors auf seiner
# Seite), der Hub selbst bleibt nicht einbettbar.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
