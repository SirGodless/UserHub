<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Invitation links</title>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/forms.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
  <script src="/assets/js/shared/theme.js"></script>
</head>
<body class="app" data-title-key="links.title" data-i18n-files="common errors shell admin links">
<div class="shell">
  <aside id="sidebar" class="sidebar"></aside>
  <main class="content">
    <header class="bar"><h1 data-i18n="links.heading">Invitation links</h1>
      <div class="right">
        <div class="seg" role="group" data-i18n-aria-label="theme.label"><button type="button" data-set-theme="light" data-i18n="theme.light">Light</button><button type="button" data-set-theme="dark" data-i18n="theme.dark">Dark</button></div>
      </div></header>
    <p id="notice" role="status"></p>
    <p id="cannot" class="info" hidden data-i18n="links.cannot"></p>
    <p id="usage" class="muted"></p>

    <form id="create-form" class="card stack" hidden novalidate>
      <h2 class="first" data-i18n="links.new.heading">New link</h2>
      <label for="validity" data-i18n="links.new.validity">Valid for (hours)</label>
      <input id="validity" type="number" min="1" step="1" class="narrow">
      <p id="validity-hint" class="muted small"></p>
      <label for="role" data-i18n="links.new.role">Role (optional)</label>
      <select id="role"></select>
      <fieldset id="rights-box" hidden>
        <legend data-i18n="links.new.permissions">Rights (optional)</legend>
        <div id="rights"></div>
      </fieldset>
      <p id="privileged-hint" class="muted small"></p>
      <div class="actions"><button type="submit" data-i18n="links.new.create">Create link</button></div>
    </form>

    <section id="created" class="card" hidden>
      <h2 class="first" data-i18n="links.created.heading">Link created</h2>
      <p><strong data-i18n="links.created.warning"></strong></p>
      <p id="created-url" class="secret"></p>
      <button type="button" id="copy" class="secondary" data-i18n="links.copy">Copy link</button>
    </section>

    <h2 data-i18n="links.list.heading">Your links</h2>
    <div id="list"></div>
  </main>
</div>
<script type="module" src="/assets/js/pages/links.js"></script>
</body>
</html>
