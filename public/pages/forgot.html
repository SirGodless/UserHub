<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Forgot password</title>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/forms.css">
</head>
<body data-title-key="forgot.title" data-i18n-files="common fields errors forgot">
<main>
  <div class="topbar">
    <span class="brand">UserHub</span>
    <div>
      <label for="lang" class="visually-hidden" data-i18n="lang.label">Language</label>
      <select id="lang"><option value="en">English</option><option value="de">Deutsch</option></select>
    </div>
  </div>
  <div class="card">
    <form id="form" novalidate>
      <h1 data-i18n="forgot.heading">Forgot your password?</h1>
      <p class="muted" data-i18n="forgot.intro"></p>
      <label for="email" data-i18n="field.email">Email address</label>
      <input id="email" type="email" autocomplete="email" required>
      <p id="error" class="error" role="alert"></p>
      <p id="sent" hidden data-i18n="forgot.sent"></p>
      <button type="submit" data-i18n="action.sendLink">Send reset link</button>
    </form>
    <p><a href="/login" data-i18n="link.backToSignin">Back to sign in</a></p>
  </div>
</main>
<script type="module" src="/assets/js/pages/forgot.js"></script>
</body>
</html>
