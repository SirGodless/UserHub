<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Administration</title>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/forms.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
  <script src="/assets/js/shared/theme.js"></script>
</head>
<body class="app" data-title-key="admin.title" data-i18n-files="common fields errors shell admin admin-users admin-roles admin-permissions admin-audit links admin-links admin-settings admin-services">
<div class="shell">
  <aside id="sidebar" class="sidebar"></aside>
  <main class="content">
    <header class="bar"><h1 data-i18n="admin.heading">Administration</h1>
      <div class="right">
        <div class="seg" role="group" data-i18n-aria-label="theme.label"><button type="button" data-set-theme="light" data-i18n="theme.light">Light</button><button type="button" data-set-theme="dark" data-i18n="theme.dark">Dark</button></div>
      </div></header>
    <p id="twofactor-banner" class="info" hidden>
      <span data-i18n="admin.twofactorNeeded"></span>
      <a href="/account/2fa" data-i18n="admin.twofactorLink">Set up two-factor authentication</a>
    </p>
    <p id="none" class="muted" hidden data-i18n="admin.none"></p>
    <div id="tabs" class="tabs" role="tablist"></div>
    <p id="notice" role="status"></p>
    <div id="panel" class="card"></div>
  </main>
</div>
<script type="module" src="/assets/js/pages/admin.js"></script>
</body>
</html>
