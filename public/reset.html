<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Choose a new password</title>
  <link rel="stylesheet" href="/assets/css/base.css">
</head>
<body data-title-key="reset.title">
<main>
  <div class="topbar">
    <span class="brand">UserHub</span>
    <div>
      <label for="lang" class="visually-hidden" data-i18n="lang.label">Language</label>
      <select id="lang"><option value="en">English</option><option value="de">Deutsch</option></select>
    </div>
  </div>
  <div class="card">
    <p id="state-loading" data-i18n="setup.loading">Checking the link ...</p>
    <section id="state-invalid" hidden>
      <h1 data-i18n="setup.invalid.heading">This link does not work</h1>
      <p data-i18n="setup.invalid.text"></p>
      <p><a href="/forgot" data-i18n="reset.requestNew">Request a new link</a></p>
    </section>
    <form id="step-form" hidden novalidate>
      <h1 data-i18n="reset.heading">Choose a new password</h1>
      <p class="muted" data-i18n="reset.intro"></p>
      <label for="password" data-i18n="field.newPassword">New password</label>
      <input id="password" type="password" autocomplete="new-password" required aria-describedby="password-hint">
      <p id="password-hint" class="muted" data-i18n="field.password.hint"></p>
      <label for="password2" data-i18n="field.passwordConfirm">Repeat password</label>
      <input id="password2" type="password" autocomplete="new-password" required>
      <p id="error" class="error" role="alert"></p>
      <button type="submit" data-i18n="action.setPassword">Set new password</button>
    </form>
    <section id="step-done" hidden>
      <h1 data-i18n="reset.doneHeading">Password changed</h1>
      <p data-i18n="reset.done"></p>
      <a class="button" href="/login" data-i18n="action.signin">Sign in</a>
    </section>
  </div>
</main>
<script type="module" src="/assets/js/reset.js"></script>
</body>
</html>
