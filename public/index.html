<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>UserHub</title>
  <link rel="stylesheet" href="/assets/css/base.css">
</head>
<body data-title-key="app.title">
<main>
  <div class="topbar">
    <span class="brand">UserHub</span>
    <div>
      <label for="lang" class="visually-hidden" data-i18n="lang.label">Language</label>
      <select id="lang"><option value="en">English</option><option value="de">Deutsch</option></select>
    </div>
  </div>
  <div class="card">
    <h1 data-i18n="index.heading">UserHub</h1>
    <section id="signed-in" hidden>
      <p><span data-i18n="index.signedInAs">Signed in as</span> <strong id="name"></strong></p>
      <p class="muted" data-i18n="index.text"></p>
      <button type="button" id="logout" class="secondary" data-i18n="action.logout">Sign out</button>
    </section>
    <section id="signed-out" hidden>
      <p class="muted" data-i18n="index.text"></p>
      <a class="button" href="/login" data-i18n="action.signin">Sign in</a>
    </section>
  </div>
</main>
<script type="module" src="/assets/js/home.js"></script>
</body>
</html>
