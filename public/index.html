<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Overview</title>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/forms.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
  <script src="/assets/js/shared/theme.js"></script>
</head>
<body class="app" data-title-key="hub.title" data-i18n-files="common errors shell hub">
<div class="shell">
  <aside id="sidebar" class="sidebar"></aside>
  <main class="content">
    <header class="bar"><h1 data-i18n="hub.heading">Overview</h1></header>
    <dl class="stats" id="stats">
      <div class="stat"><dt data-i18n="hub.stat.services">Services</dt><dd id="stat-services">-</dd></div>
      <div class="stat"><dt data-i18n="hub.stat.online">Online</dt><dd id="stat-online">-</dd></div>
      <div class="stat"><dt data-i18n="hub.stat.offline">Offline</dt><dd id="stat-offline">-</dd></div>
      <div class="stat"><dt data-i18n="hub.stat.links">Active links</dt><dd id="stat-links">-</dd></div>
    </dl>

    <h2 data-i18n="hub.services.heading">Your services</h2>
    <p id="empty" class="info" hidden data-i18n="hub.services.empty"></p>
    <div id="services-wrap" class="table-wrap" hidden>
      <table>
        <thead><tr><th scope="col" data-i18n="hub.col.name">Name</th><th scope="col" data-i18n="hub.col.status">Status</th><th scope="col" data-i18n="hub.col.checked">Checked</th><th scope="col" class="act" data-i18n="hub.col.action">Action</th></tr></thead>
        <tbody id="services"></tbody>
      </table>
    </div>
    <p class="muted small" data-i18n="hub.legend.openNote"></p>

    <h2 data-i18n="hub.account.heading">Account</h2>
    <div class="rows" id="account-rows"></div>
  </main>
</div>
<script type="module" src="/assets/js/pages/hub.js"></script>
</body>
</html>
