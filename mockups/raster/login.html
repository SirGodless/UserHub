<!doctype html>
<html lang="de" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Anmelden (Mockup Raster)</title>
<link rel="stylesheet" href="style.css"><script src="theme.js"></script></head>
<body>
<main class="login">
  <div class="top"><span class="brand">UserHub</span>
    <div class="seg" role="group" aria-label="Darstellung"><button data-set-theme="light">Hell</button><button data-set-theme="dark">Dunkel</button></div></div>
  <section class="panel">
    <h1>Anmelden</h1>
    <p class="muted">Melde dich an, um zu deinen Diensten zu kommen.</p>
    <form onsubmit="return false">
      <label for="u">Username oder E-Mail</label><input id="u" type="text" value="joshua" autocomplete="username">
      <label for="p">Passwort</label><input id="p" type="password" value="correct horse" autocomplete="current-password">
      <label class="check" style="margin-top:1.2rem"><input type="checkbox" checked><span>Eingeloggt bleiben</span></label>
      <button type="submit" class="primary">Anmelden</button>
    </form>
    <p style="margin:1.2rem 0 0"><a href="#">Passwort vergessen?</a></p>
  </section>
  <p class="foot">Zugang nur mit Einladung</p>
</main>
</body></html>
